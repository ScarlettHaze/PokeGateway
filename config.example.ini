; PokeGateway configuration. Copy to config.ini and adjust.

[server]
; IP address handed out by the DNS server for Nintendo/GameSpy hosts.
; "auto" picks this machine's LAN address. Use your public IP (or a domain's
; IP) if players connect over the internet.
public_ip = auto
bind = 0.0.0.0
db_path = data/pokegateway.db
log_level = INFO

[dns]
enabled = true
; Resolve every lookup to this server (recommended for a DS-only WFC setup,
; so no console request escapes to the real internet).
redirect_all = true
port = 53
; Where non-Nintendo lookups are forwarded.
upstream = 1.1.1.1
ttl = 300
; Additional domains (comma separated) to point at this server.
extra_domains =

[http]
; Plain HTTP: conntest, gamestats2 (GTS, Battle Tower), dls1, and NAS when
; a TLS proxy forwards nas.nintendowifi.net:443 here.
port = 80

[gamespy]
gpcm_port = 29900
gpsp_port = 29901
qr_port = 27900
natneg_port = 27901
sb_port = 28910

[global_terminal]
; Gen 4 battle videos / dress-ups / boxes (plain TCP).
gen4_port = 12400
; Gen 5 battle videos / musicals. The game connects to 12401 with SSLv3, so
; a legacy TLS proxy listens on 12401 and forwards here.
gen5_port = 12411

[dls1]
; Wi-Fi Mystery Gift files: dlc/<GAMECODE>/<file>
dir = dlc

[gamekeys]
; GameSpy game name = secret key (needed for matchmaking).
pokemondpds = 1vTlwb
pokemonplatds = IIup73
syachi2ds = tXH2sN

[tls]
; Built-in SSLv3/RC4 termination (pure Python via tlslite-ng). No external
; stunnel/nginx/Docker proxy needed. Requires: pip install tlslite-ng
enabled = true
https_port = 443
gt5_tls_port = 12401
cert = certs/server-chain.crt
key = certs/server.key
gt5_cert = certs/gt5.crt
gt5_key = certs/gt5.key
