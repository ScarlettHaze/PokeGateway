; SSLv3/RC4 termination for the Nintendo DS.
; Certificates are mounted at /certs (see README, "SSL certificates"):
;   server-chain.crt  your server certificate followed by the Wii NWC cert
;   server.key        your server key (1024-bit RSA)
;   gt5.crt / gt5.key any certificate for the Gen 5 Global Terminal

foreground = yes
debug = 4
; The DS never sends close_notify; don't wait for it.
TIMEOUTclose = 0

[nintendo-https]
; nas.nintendowifi.net, dls1.nintendowifi.net, pkvldtprod.nintendo.co.jp
accept = 0.0.0.0:443
connect = 127.0.0.1:80
cert = /certs/server-chain.crt
key = /certs/server.key
sslVersion = SSLv3
ciphers = RC4-SHA:RC4-MD5:@SECLEVEL=0
; The DS can't handle the SSLv3 empty-fragment countermeasure.
options = DONT_INSERT_EMPTY_FRAGMENTS
securityLevel = 0

[gen5-global-terminal]
; pkgdsprod.nintendo.co.jp:12401 (Gen 5 battle videos, musicals)
accept = 0.0.0.0:12401
connect = 127.0.0.1:12411
cert = /certs/gt5.crt
key = /certs/gt5.key
sslVersion = SSLv3
ciphers = RC4-SHA:RC4-MD5:@SECLEVEL=0
options = DONT_INSERT_EMPTY_FRAGMENTS
securityLevel = 0
