worker_processes 1;
events { worker_connections 256; }

# Certificates are mounted at /certs (see README "SSL certificates"):
#   nas.crt / nas.key    - chain the DS accepts for nas.nintendowifi.net
#   gt5.crt / gt5.key    - any certificate (the DS does not validate it)

http {
    server {
        listen 443 ssl;
        server_name nas.nintendowifi.net naswii.nintendowifi.net pkvldtprod.nintendo.co.jp;

        ssl_protocols SSLv3 TLSv1;
        ssl_ciphers RC4-SHA:RC4-MD5;
        ssl_prefer_server_ciphers on;
        ssl_certificate     /certs/nas.crt;
        ssl_certificate_key /certs/nas.key;

        location / {
            proxy_pass http://127.0.0.1:80;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}

stream {
    server {
        listen 12401 ssl;
        ssl_protocols SSLv3 TLSv1;
        ssl_ciphers RC4-SHA:RC4-MD5;
        ssl_certificate     /certs/gt5.crt;
        ssl_certificate_key /certs/gt5.key;
        proxy_pass 127.0.0.1:12411;
    }
}
